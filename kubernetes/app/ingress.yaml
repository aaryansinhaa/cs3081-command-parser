apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: command-parser
                port:
                  number: 80
