# min 1, max 2, CPU target 70% of the container request.
# Scale-down window is shorter than the Kubernetes default so a local demonstration can
# observe both directions. The single-node cluster still cannot add real machines.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: command-parser
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: command-parser
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
