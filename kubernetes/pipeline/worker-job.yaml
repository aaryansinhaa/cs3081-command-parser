apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-label
  namespace: pipeline
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {job: teacher-label}
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: cc3081/worker:v1
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_COUNT, value: "2"}
            - {name: TEACHER_MODEL, value: "phi3.5"}
            - {name: TEACHER_TEMPERATURE, value: "0"}
            - {name: TEACHER_SEED, value: "42"}
            - {name: DATASETS_BUCKET, value: "datasets"}
            - {name: OLLAMA_HOST, value: "http://host.k3d.internal:11434"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: WORKER_DATA_DIR, value: "/tmp/datasets"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
